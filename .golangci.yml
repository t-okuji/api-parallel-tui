version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - containedctx
    - depguard
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - paralleltest
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    depguard:
      rules:
        deny_legacy:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: io/ioutil
              desc: "https://pkg.go.dev/io/ioutil"
            - pkg: golang.org/x/net/context
              desc: "https://pkg.go.dev/golang.org/x/net/context"

formatters:
  enable:
    - gofmt
    - goimports
