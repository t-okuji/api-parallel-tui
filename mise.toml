[tools]
go = "1.26.3"
golangci-lint = "2.12.2"

[tasks.run]
description = "Run the TUI application"
run = "go run ./cmd/api-parallel-tui"
alias = "r"

[tasks.build]
description = "Build the local binary into build/"
run = [
  "mkdir -p build",
  "go build -o build/api-parallel-tui ./cmd/api-parallel-tui",
]
alias = "b"

[tasks.build-windows-amd64]
description = "Build Windows amd64 executable into build/"
run = [
  "mkdir -p build",
  "GOOS=windows GOARCH=amd64 go build -o build/api-parallel-tui-windows-amd64.exe ./cmd/api-parallel-tui",
]

[tasks.build-windows-arm64]
description = "Build Windows arm64 executable into build/"
run = [
  "mkdir -p build",
  "GOOS=windows GOARCH=arm64 go build -o build/api-parallel-tui-windows-arm64.exe ./cmd/api-parallel-tui",
]

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"
alias = "l"

[tasks.fmt]
description = "Format code with golangci-lint formatters and gofmt"
run = [
  "golangci-lint fmt",
  "gofmt -w ./cmd ./internal",
]

[tasks.test]
description = "Run Go tests"
run = "go test ./..."
alias = "t"

[tasks.tidy]
description = "Tidy Go modules"
run = "go mod tidy"

[tasks.check]
description = "Run format, lint, test, and build checks"
depends = ["fmt", "lint", "test", "build"]
alias = "c"
